<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Planos</title>
    <link rel="stylesheet" href="./styles.css" />
</head>
<body>
    <main class="pricing">
        <div class="container">
            <header class="pricing__header">
                <h1 class="pricing__title"></h1>
                <p class="pricing__subtitle"></p>
            </header>

            <section class="cards" aria-label="Planos de hospedagem">
                <!-- Card 1 -->
                <article class="card" aria-labelledby="plano-basico">
                    <div class="card__head">
                        <h2 id="plano-basico" class="card__title"></h2>
                        <div class="card__price"></div>
                        <div class="card__meta"></div>
                    </div>
                    <ul class="card__features">
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                    </ul>
                    <button class="card__cta" type="button">COMPRAR</button>
                </article>

                <!-- Card 2 -->
                <article class="card card--featured" aria-labelledby="plano-profissional">
                    <div class="card__head">
                        <h2 id="plano-profissional" class="card__title"></h2>
                        <div class="card__price"></div>
                        <div class="card__meta"></div>
                    </div>
                    <ul class="card__features">
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                    </ul>
                    <button class="card__cta" type="button">COMPRAR</button>
                </article>

                <!-- Card 3 -->
                <article class="card" aria-labelledby="plano-plus">
                    <div class="card__head">
                        <h2 id="plano-plus" class="card__title"></h2>
                        <div class="card__price"></div>
                        <div class="card__meta"></div>
                    </div>
                    <ul class="card__features">
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                    </ul>
                    <button class="card__cta" type="button">COMPRAR</button>
                </article>
            </section>
        </div>
    </main>
    <footer class="footer"></footer>
</body>
</html>
